# AWS CodeBuild: build the image, push it to ECR and deploy it to ECS.
# ECS performs the Blue/Green switch (the service's deployment strategy is
# BLUE_GREEN, set by the infrastructure repository).
#
# Environment variables set on the CodeBuild project (infrastructure repository):
#   REPOSITORY_URI  ECR repository URI (<account>.dkr.ecr.<region>.amazonaws.com/<name>)
#   ECS_CLUSTER     ECS cluster name
#   ECS_SERVICE     ECS service name
#   CONTAINER_NAME  container in the task definition that runs the API
#   TASK_FAMILY     task definition family of the service
version: 0.2

env:
  shell: bash
  variables:
    # Mirror of the Docker Hub image, avoids Docker Hub rate limits.
    NODE_IMAGE: public.ecr.aws/docker/library/node:24-bookworm-slim

phases:
  pre_build:
    on-failure: ABORT
    commands:
      - ': "${REPOSITORY_URI:?}" "${ECS_CLUSTER:?}" "${ECS_SERVICE:?}" "${CONTAINER_NAME:?}" "${TASK_FAMILY:?}"'
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"
      - IMAGE="$REPOSITORY_URI:$IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
  build:
    on-failure: ABORT
    commands:
      - docker build --build-arg NODE_IMAGE="$NODE_IMAGE" --build-arg APP_VERSION="$CODEBUILD_RESOLVED_SOURCE_VERSION" -t "$IMAGE" .
      - docker push "$IMAGE"
  post_build:
    commands:
      # Register a new revision of the family's latest task definition with
      # only the API image changed, then point the service at it. The latest
      # revision is the last deployment's, or a newer one registered by the
      # infrastructure repository (environment variables, secrets), which
      # Terraform does not apply to the service itself.
      - |
        set -euo pipefail
        aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
          --query taskDefinition > taskdef-current.json
        jq --arg name "$CONTAINER_NAME" --arg image "$IMAGE" '
          if ([.containerDefinitions[].name] | index($name)) == null
          then error("container \($name) not found in the task definition") else . end
          | .containerDefinitions |= map(if .name == $name then .image = $image else . end)
          | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
        ' taskdef-current.json > taskdef-new.json
        new_arn=$(aws ecs register-task-definition --cli-input-json file://taskdef-new.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)
        echo "Deploying $new_arn"
        aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
          --task-definition "$new_arn" > /dev/null
        # Fails the build if the deployment does not become stable (ECS rolls
        # back a failed Blue/Green deployment). Waits up to 10 minutes.
        aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
