# Azure ACR Tasks: build the image, push it to ACR and update the Container
# App (new revision). The task runs on a commit (merge) to the configured
# branch of this repository.
#
# Values set on the task (infrastructure repository, `--set` / task values):
#   IMAGE_NAME          image name in the registry (e.g. multicloud-api)
#   CONTAINER_APP       Container App name
#   RESOURCE_GROUP      resource group of the Container App
#   IDENTITY_CLIENT_ID  client ID of the task's user-assigned managed identity
#                       (needs permission to update the Container App)
version: v1.1.0

steps:
  - id: build
    build: -t $Registry/{{.Values.IMAGE_NAME}}:{{.Run.ID}} -f Dockerfile .

  - id: push
    push:
      - $Registry/{{.Values.IMAGE_NAME}}:{{.Run.ID}}

  - id: deploy
    cmd: >-
      mcr.microsoft.com/azure-cli bash -c
      'az login --identity --client-id {{.Values.IDENTITY_CLIENT_ID}} --only-show-errors > /dev/null
      && az containerapp update
      --name {{.Values.CONTAINER_APP}}
      --resource-group {{.Values.RESOURCE_GROUP}}
      --image $Registry/{{.Values.IMAGE_NAME}}:{{.Run.ID}}
      --only-show-errors --output none'
    timeout: 900
